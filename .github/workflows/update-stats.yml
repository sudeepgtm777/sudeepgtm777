name: Update GitHub stats cards

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh cards on stats branch
        run: |
          set -euo pipefail
          git config user.name "sudeepgtm777"
          git config user.email "sudeepgautam777@gmail.com"

          if git ls-remote --exit-code --heads origin stats >/dev/null; then
            git fetch origin stats
            git checkout -B stats origin/stats
          else
            git checkout --orphan stats
            git rm -rf --ignore-unmatch .
          fi

          curl -fsSL -o github-stats.svg \
            "https://github-readme-stats-alpha-flame.vercel.app/api?username=sudeepgtm777&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&border_radius=12&hide_rank=true&hide=contribs"

          curl -fsSL -o github-langs.svg \
            "https://github-readme-stats-alpha-flame.vercel.app/api/top-langs/?username=sudeepgtm777&layout=compact&theme=tokyonight&hide_border=true&border_radius=12&langs_count=8"

          for file in github-stats.svg github-langs.svg; do
            if ! grep -q '<svg' "$file"; then
              echo "Expected SVG in $file" >&2
              head -c 200 "$file" >&2
              exit 1
            fi
          done

          git add github-stats.svg github-langs.svg
          if git diff --staged --quiet; then
            echo "Stats cards are unchanged"
            exit 0
          fi
          git commit -m "chore: refresh GitHub stats cards"
          git push origin HEAD:stats
