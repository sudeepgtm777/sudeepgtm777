name: Update GitHub stats cards

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch stats cards
        run: |
          set -euo pipefail
          mkdir -p assets

          curl -fsSL -o assets/github-stats.svg \
            "https://github-readme-stats-alpha-flame.vercel.app/api?username=sudeepgtm777&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&border_radius=12&hide_rank=true&hide=contribs"

          curl -fsSL -o assets/github-langs.svg \
            "https://github-readme-stats-alpha-flame.vercel.app/api/top-langs/?username=sudeepgtm777&layout=compact&theme=tokyonight&hide_border=true&border_radius=12&langs_count=8"

          for file in assets/github-stats.svg assets/github-langs.svg; do
            if ! grep -q '<svg' "$file"; then
              echo "Expected SVG in $file" >&2
              head -c 200 "$file" >&2
              exit 1
            fi
          done

      - name: Commit updated cards
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/github-langs.svg
          if git diff --staged --quiet; then
            echo "Stats cards are unchanged"
            exit 0
          fi
          git commit -m "chore: refresh GitHub stats cards"
          git push
